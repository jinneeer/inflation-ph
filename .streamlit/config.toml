# Palette: navy #082F49 · teal #0E7490 · green #22C55E · sky #BAE6FD · ice #F0FDFF
[theme]
base = "light"
font = "'Google Sans':https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 600, 600, 600, 500, 500]
primaryColor = "#0E7490"
backgroundColor = "#F0FDFF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#082F49"
